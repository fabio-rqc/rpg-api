spring.application.name=rpg-api

# Banco H2 em arquivo (os dados continuam salvos depois de reiniciar)
spring.datasource.url=jdbc:h2:file:./data/rpgdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza a tabela automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true

server.port=8081
